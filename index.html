<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kararlı Mobil Barkod Okuyucu</title>
    <!-- Stabil Kütüphane Bağlantısı -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-top: 0; text-align: center; }
        #reader {
            width: 100%;
            max-width: 450px;
            min-height: 300px;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
            box-sizing: border-box;
        }
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .result-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }
        #result-text {
            word-break: break-all;
            font-size: 16px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .btn-action {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Kodu ekranın ortasındaki kutucuğa hizalayın.</p>

    <!-- Entegre Kamera ve Tarama Alanı -->
    <div id="reader"></div>

    <!-- Sonuç Alanı -->
    <div id="result-container">
        <div class="result-title">🟢 Okunan Sonuç:</div>
        <div id="result-text">Henüz tarama yapılmadı...</div>
        <div id="action-area"></div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result-text').innerText = decodedText;
            let actionArea = document.getElementById('action-area');
            actionArea.innerHTML = ''; 

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                let linkBtn = document.createElement('a');
                linkBtn.href = decodedText;
                linkBtn.target = '_blank';
                linkBtn.className = 'btn-action';
                linkBtn.innerText = 'Bağlantıyı Aç';
                actionArea.appendChild(linkBtn);
            } else {
                let searchBtn = document.createElement('a');
                searchBtn.href = "https://google.com" + encodeURIComponent(decodedText);
                searchBtn.target = '_blank';
                searchBtn.className = 'btn-action';
                searchBtn.innerText = "Google'da Ara";
                actionArea.appendChild(searchBtn);
            }
        }

        function startScanner() {
            // Xiaomi donanım çakışmasını engelle
            Html5Qrcode.prototype.useBarCodeDetectorIfSupported = function() { return false; };

            const html5QrCode = new Html5Qrcode("reader");
            
            // Çizgi barkodlar ve QR kodlar için optimize edilmiş tarama odağı ayarları
            const config = { 
                fps: 15, 
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    // Ekran genişliğine göre dinamik odak kutusu (Çizgi barkodları rahat yakalaması için yatay)
                    let minEdgePercentage = 0.7;
                    let boxWidth = Math.floor(viewfinderWidth * minEdgePercentage);
                    if (boxWidth < 250) boxWidth = 250;
                    return { width: boxWidth, height: 180 };
                }
            };

            // Önceki adımda test ettiğimiz kesin çalışan başlatma komutu
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.error("Tarayıcı başlatılamadı:", err);
            });
        }

        // Sayfa açıldığında tarayıcıyı tetikle
        window.addEventListener('DOMContentLoaded', startScanner);
    </script>
</body>
</html>
