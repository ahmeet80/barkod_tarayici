<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesin Çözüm Barkod Tarayıcı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-top: 0; text-align: center; }
        #video-container {
            width: 100%;
            max-width: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #error-msg {
            color: #e74c3c;
            background: #fde8e7;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            max-width: 450px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Eğer izin penceresi gelirse mutlaka onay verin.</p>

    <!-- Doğrudan Telefonun Ham Kamerası -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="error-msg" id="errorBox"></div>

    <script>
        async function startCamera() {
            const video = document.getElementById('webcam');
            const errorBox = document.getElementById('error-msg');
            
            try {
                // Tarayıcıyı doğrudan donanım seviyesinde kamera açmaya zorlar
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } } // Kesinlikle arka kamerayı aç
                });
                video.srcObject = stream;
            } catch (err) {
                console.log("Arka kamera hatası, yedek kameraya geçiliyor...", err);
                try {
                    // Eğer 'exact' komutu sorun yarattıysa normal arka kamerayı dene
                    const streamAlternative = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    video.srcObject = streamAlternative;
                } catch (err2) {
                    errorBox.style.display = "block";
                    errorBox.innerHTML = "<b>Kamera Erişim Hatası:</b><br>" + err2.name + ": " + err2.message + 
                    "<br><br>Lütfen Chrome ayarlarından sitenin kamera iznini engellemediğinden emin olun.";
                }
            }
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
