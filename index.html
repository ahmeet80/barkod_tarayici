<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Hızlı Barkod Tarayıcı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-top: 0; text-align: center; }
        #video-container {
            width: 100%;
            max-width: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .result-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }
        #result-text {
            word-break: break-all;
            font-size: 16px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .btn-action {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .scan-target {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
            transform: translateY(-50%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Barkodu veya QR kodu kırmızı çizgiye hizalayın.</p>

    <!-- Kesin Açılan Yerleşik Kamera Sistemi -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-target"></div>
    </div>

    <!-- Sonuç Alanı -->
    <div id="result-container">
        <div class="result-title">🟢 Okunan Sonuç:</div>
        <div id="result-text">Henüz tarama yapılmadı...</div>
        <div id="action-area"></div>
    </div>

    <script>
        let lastResult = null;
        let barcodeDetector;

        async function initScanner() {
            const video = document.getElementById('webcam');
            
            // 1. ADIM: Tarayıcının yerleşik barkod tanıma motorunu kontrol et (Destek yoksa polyfill aç)
            if (!('BarcodeDetector' in window)) {
                // Eğer cihaz doğrudan desteklemiyorsa harici motoru dinamik olarak yükle
                const script = document.createElement('script');
                script.src = "https://jsdelivr.net";
                document.head.appendChild(script);
                script.onload = async () => {
                    barcodeDetector = new window.BarcodeDetector.BarcodeDetector({
                        formats: ['ean_13', 'ean_8', 'qr_code', 'code_128', 'upc_a']
                    });
                    startCamera(video);
                };
            } else {
                barcodeDetector = new BarcodeDetector({
                    formats: ['ean_13', 'ean_8', 'qr_code', 'code_128', 'upc_a']
                });
                startCamera(video);
            }
        }

        async function startCamera(video) {
            try {
                // 2. ADIM: Donanım seviyesinde kamerayı kesin olarak aç
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;

                // 3. ADIM: Kamera oynamaya başladığında tarama döngüsünü tetikle
                video.addEventListener('playing', () => {
                    setInterval(async () => {
                        if (video.readyState === video.HAVE_CURRENT_DATA && barcodeDetector) {
                            try {
                                const barcodes = await barcodeDetector.detect(video);
                                if (barcodes.length > 0) {
                                    const code = barcodes[0].rawValue;
                                    if (code && lastResult !== code) {
                                        lastResult = code;
                                        handleScanSuccess(code);
                                    }
                                }
                            } catch (e) {
                                console.error("Tarama hatası:", e);
                            }
                        }
                    }, 100); // 100 ms'de bir (Saniyede 10 tarama) çok hızlı analiz yapar
                });
            } catch (err) {
                alert("Kamera izni veya erişim hatası: " + err.message);
            }
        }

        function handleScanSuccess(decodedText) {
            document.getElementById('result-text').innerText = decodedText;
            let actionArea = document.getElementById('action-area');
            actionArea.innerHTML = ''; 

            if (navigator.vibrate) navigator.vibrate(100); // Başarılı okumada hafif titreşim

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                let linkBtn = document.createElement('a');
                linkBtn.href = decodedText;
                linkBtn.target = '_blank';
                linkBtn.className = 'btn-action';
                linkBtn.innerText = 'Bağlantıyı Aç';
                actionArea.appendChild(linkBtn);
            } else {
                let searchBtn = document.createElement('a');
                searchBtn.href = "https://google.com" + encodeURIComponent(decodedText);
                searchBtn.target = '_blank';
                searchBtn.className = 'btn-action';
                searchBtn.innerText = "Google'da Ara";
                actionArea.appendChild(searchBtn);
            }
        }

        window.addEventListener('DOMContentLoaded', initScanner);
    </script>
</body>
</html>
