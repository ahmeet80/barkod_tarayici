<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çizgili Barkod Okuyucu</title>
    <!-- Gelişmiş Çizgili Barkod Tarama Kütüphanesi -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-top: 0; text-align: center; }
        #interactive {
            width: 100%;
            max-width: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        /* Kütüphanenin oluşturduğu video elementini tam oturt */
        #interactive video {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Kütüphanenin oluşturduğu ekstra tuvali gizle */
        #interactive canvas.drawingBuffer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .result-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }
        #result-text {
            word-break: break-all;
            font-size: 16px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .btn-action {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        /* Barkod hizalama kılavuzu */
        .scan-target {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
            transform: translateY(-50%);
            z-index: 10;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Ürün barkodunu yatay olacak şekilde kırmızı çizgiye hizalayın.</p>

    <!-- Kamera Alanı -->
    <div id="interactive" class="viewport">
        <div class="scan-target"></div>
    </div>

    <!-- Sonuç Alanı -->
    <div id="result-container">
        <div class="result-title">🟢 Okunan Barkod No:</div>
        <div id="result-text">Henüz tarama yapılmadı...</div>
        <div id="action-area"></div>
    </div>

    <script>
        // Aynı kodun üst üste okunmasını engellemek için son okunanı tutuyoruz
        let lastResult = null;

        function startQuagga() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: {
                        width: 640,
                        height: 480,
                        facingMode: "environment" // Kesinlikle arka kamera
                    },
                },
                locator: {
                    patchSize: "medium",
                    halfSample: true
                },
                numOfWorkers: 2,
                // Türkiye ve dünyadaki tüm standart market/ürün barkod türleri (EAN, UPC, Code128)
                decoder: {
                    readers: [
                        "ean_reader",
                        "ean_8_reader",
                        "code_128_reader",
                        "upc_reader",
                        "upc_e_reader"
                    ]
                },
                locate: true
            }, function(err) {
                if (err) {
                    console.error("Başlatma hatası:", err);
                    return;
                }
                console.log("Barkod motoru hazır, tarama başlıyor...");
                Quagga.start();
            });

            // Barkod başarıyla tespit edildiğinde çalışacak fonksiyon
            Quagga.onDetected(function(result) {
                let code = result.codeResult.code;
                
                // Hatalı veya kaymış okumaları önlemek için kontrol
                if (!code || lastResult === code) return;
                
                lastResult = code;
                document.getElementById('result-text').innerText = code;
                
                // Sesli geri bildirim efekti (Bip sesi) alternatifi
                if (navigator.vibrate) navigator.vibrate(100);

                let actionArea = document.getElementById('action-area');
                actionArea.innerHTML = ''; 

                let searchBtn = document.createElement('a');
                searchBtn.href = "https://google.com" + encodeURIComponent(code);
                searchBtn.target = '_blank';
                searchBtn.className = 'btn-action';
                searchBtn.innerText = "Google'da Ara";
                actionArea.appendChild(searchBtn);
            });
        }

        window.addEventListener('DOMContentLoaded', startQuagga);
    </script>
</body>
</html>
