<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Barkod & QR Okuyucu</title>
    <!-- GÜNCEL KÜTÜPHANE -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 0;
        }
        #reader {
            width: 100%;
            max-width: 450px;
            min-height: 250px;
            background: #e9ecef;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .result-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #result-text {
            word-break: break-all;
            font-size: 16px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .btn-action {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Barkodu veya QR kodu kameraya ortalayacak şekilde hizalayın.</p>

    <!-- Kamera Önizleme Alanı -->
    <div id="reader">Kamera başlatılıyor...</div>

    <!-- Sonuçların Gösterileceği Alan -->
    <div id="result-container">
        <div class="result-title">🟢 Okunan Sonuç:</div>
        <div id="result-text">Henüz tarama yapılmadı...</div>
        <div id="action-area"></div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('result-text').innerText = decodedText;
            let actionArea = document.getElementById('action-area');
            actionArea.innerHTML = ''; 

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                let linkBtn = document.createElement('a');
                linkBtn.href = decodedText;
                linkBtn.target = '_blank';
                linkBtn.className = 'btn-action';
                linkBtn.innerText = 'Bağlantıyı Aç';
                actionArea.appendChild(linkBtn);
            } else {
                let searchBtn = document.createElement('a');
                searchBtn.href = "https://google.com" + encodeURIComponent(decodedText);
                searchBtn.target = '_blank';
                searchBtn.className = 'btn-action';
                searchBtn.innerText = "Google'da Ara";
                actionArea.appendChild(searchBtn);
            }
        }

        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        // Akıllı Kamera Seçimi: Önce arka kamerayı dene, olmazsa mevcut herhangi bir kamerayı aç
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            console.log("Arka kamera bulunamadı veya izin verilmedi, herhangi bir kamera deneniyor...", err);
            // Eğer arka kamera yoksa (Bilgisayardaysanız) varsayılan web kamerasını açar
            html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
            .catch(err2 => {
                document.getElementById('reader').innerText = "Kamera izni reddedildi veya kameraya ulaşılamadı. Lütfen adres çubuğundaki kilit simgesinden kamera iznini kontrol edin.";
                console.error("Kamera tamamen başarısız: ", err2);
            });
        });
    </script>
</body>
</html>
