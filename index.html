<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesin Çözüm Barkod Tarayıcı</title>
    <!-- Tarama kütüphanesi -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-top: 0; text-align: center; }
        #video-container {
            width: 100%;
            max-width: 450px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #result-container {
            margin-top: 20px;
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .result-title {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }
        #result-text {
            word-break: break-all;
            font-size: 16px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .btn-action {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        /* Ekranda barkodu nereye tutacağınızı gösteren kılavuz çizgi */
        .scanner-laser {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background: red;
            opacity: 0.7;
            box-shadow: 0 0 8px red;
        }
    </style>
</head>
<body>

    <h2>Barkod Tarayıcı</h2>
    <p>Barkodu kırmızı çizgiye gelecek şekilde kameraya hizalayın.</p>

    <!-- Telefonunuzun Kesin Açılan Kamera Yapısı -->
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scanner-laser"></div>
    </div>

    <!-- Sonuç Alanı -->
    <div id="result-container">
        <div class="result-title">🟢 Okunan Sonuç:</div>
        <div id="result-text">Henüz tarama yapılmadı...</div>
        <div id="action-area"></div>
    </div>

    <!-- Arka planda analiz için gizli tuval -->
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        let html5QrCodeLocal;
        let scanInterval;

        function onScanSuccess(decodedText) {
            document.getElementById('result-text').innerText = decodedText;
            let actionArea = document.getElementById('action-area');
            actionArea.innerHTML = ''; 

            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                let linkBtn = document.createElement('a');
                linkBtn.href = decodedText;
                linkBtn.target = '_blank';
                linkBtn.className = 'btn-action';
                linkBtn.innerText = 'Bağlantıyı Aç';
                actionArea.appendChild(linkBtn);
            } else {
                let searchBtn = document.createElement('a');
                searchBtn.href = "https://google.com" + encodeURIComponent(decodedText);
                searchBtn.target = '_blank';
                searchBtn.className = 'btn-action';
                searchBtn.innerText = "Google'da Ara";
                actionArea.appendChild(searchBtn);
            }
        }

        async function startEngine() {
            const video = document.getElementById('webcam');
            
            try {
                // 1. Adım: Kamerayı saf HTML motoruyla çalıştır
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;

                // 2. Adım: Tarayıcı motorunu arka planda hazırla
                html5QrCodeLocal = new Html5Qrcode("hidden-canvas", { verbose: false });

                // 3. Adım: Saniyede 5 kez kameradan kare yakalayıp tarama kütüphanesine gönder
                video.addEventListener('playing', () => {
                    const canvas = document.getElementById('hidden-canvas');
                    const context = canvas.getContext('2d');

                    scanInterval = setInterval(() => {
                        if (video.videoWidth > 0 && video.videoHeight > 0) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            // Videonun anlık karesini gizli canvas'a çiz
                            context.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            // Çizilen kareyi kütüphaneye taratması için gönder
                            html5QrCodeLocal.scanLocalImage(canvas)
                                .then(decodedText => {
                                    onScanSuccess(decodedText);
                                })
                                .catch(err => {
                                    // Kod bulunamadığında hata basmaması için burayı boş bırakıyoruz
                                });
                        }
                    }, 200); // 200 milisaniyede bir (Saniyede 5 kare) tarama yapar
                });

            } catch (err) {
                alert("Kamera başlatılamadı. Lütfen Chrome izinlerini kontrol edin: " + err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', startEngine);
    </script>
</body>
</html>
